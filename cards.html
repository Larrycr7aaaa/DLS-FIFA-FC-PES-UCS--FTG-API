<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLS 26 Cards SPA</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="loading" class="hidden">
        <div class="loader"></div>
        <p>Cargando datos...</p>
    </div>

    <div id="errorMessage" class="hidden"></div>

    <header>
        <div class="logo">
            <div>
                <h1>DLS 26 SPA</h1>
                <p>Colección Oficial de Cartas</p>
            </div>
        </div>

        <div class="music-player">
            <audio id="audioTrack" src="sound 1 dls.mp3"></audio>
            <div class="music-info">
                <span id="trackTitle">🎵 Carga tu música</span>
            </div>
            <div class="music-controls">
                <select id="trackSelect"></select>
                <button id="playPauseBtn">▶</button>
            </div>
        </div>

        <div class="search">
            <input type="text" id="searchInput" placeholder="Buscar jugador, equipo, país...">
            <button id="searchButton">Buscar</button>
        </div>
    </header>

    <main>
        <section class="player-list">
            <div class="section-title">
                <h2>Jugadores</h2>
                <span id="playerCounter">0 Jugadores</span>
            </div>

            <div id="playerContainer"></div>

            <div class="pagination">
                <button id="previousBtn" disabled>← Anterior</button>
                <button id="nextBtn">Siguiente →</button>
            </div>
        </section>

        <aside class="player-detail">
            <div id="detailContainer">
                <h2>Selecciona un jugador</h2>
                <p>Haz clic en "Ver Información" para examinar los atributos completos.</p>
            </div>
        </aside>
    </main>

    <footer>
        <p>Proyecto SPA utilizando API DLS 26</p>
        <p><small>HTML • CSS • JavaScript • Fetch API</small></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
